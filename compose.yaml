services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: littree
      POSTGRES_USER: littree
      POSTGRES_PASSWORD: littree
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/up:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U littree"]
      interval: 5s
      timeout: 5s
      retries: 5

  ltg-langserver:
    build:
      context: .
      dockerfile: ltg-langserver/Dockerfile
    environment:
      LTG_HTTP_ADDR: "0.0.0.0:4000"
    ports:
      # HTTP companion (POST /compile, GET /health) and WebSocket LSP (GET /ws).
      # The stdio LSP transport is not exposed here; use GET /ws from the browser.
      - "4000:4000"

volumes:
  postgres_data:
