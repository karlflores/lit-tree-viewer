services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: littree
      POSTGRES_USER: littree
      POSTGRES_PASSWORD: littree
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/up:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U littree"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
