[package]
name = "ltg-langserver"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ltg-langserver"
path = "src/main.rs"

[dependencies]
logos      = "0.14"
chumsky    = "0.9"
tower-lsp  = "0.20"
tokio      = { version = "1", features = ["full"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap    = "5"
axum       = { version = "0.7", features = ["ws"] }
futures    = "0.3"

[dev-dependencies]
# Unit tests live in-module; no extra crates needed.
